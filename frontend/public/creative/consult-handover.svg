<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!--
    Campaign creative: health checkup, booking and report handover.
    Vector interpretation of the supplied reference (two colleagues, documents,
    glass wall onto planting) in the locked palette.
  -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9C4F0"/>
      <stop offset="50%" stop-color="#A9C8DE"/>
      <stop offset="100%" stop-color="#8FA8D8"/>
    </linearGradient>
    <linearGradient id="kurta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E29BE8"/>
      <stop offset="100%" stop-color="#9A5BC4"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8E4FD0"/>
      <stop offset="100%" stop-color="#4A1C6B"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A7A"/>
      <stop offset="100%" stop-color="#FF6A62"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#glass)"/>

  <!-- glazing grid -->
  <g stroke="#6E6AA8" stroke-width="12" opacity="0.55">
    <line x1="410" y1="0" x2="410" y2="760"/>
    <line x1="880" y1="0" x2="880" y2="760"/>
  </g>
  <g fill="#B9A8E8" opacity="0.5">
    <rect x="60" y="40" width="90" height="150" rx="8"/>
    <rect x="190" y="60" width="70" height="120" rx="8"/>
    <rect x="300" y="30" width="80" height="170" rx="8"/>
  </g>

  <!-- planting beyond the glass -->
  <g>
    <rect x="410" y="560" width="470" height="200" fill="#7E8FC4" opacity="0.5"/>
    <g fill="#2F6B47">
      <path d="M470 760 q-40 -120 26 -196 q52 82 30 196 Z"/>
      <path d="M560 760 q-52 -104 8 -178 q60 70 44 178 Z"/>
      <path d="M700 760 q-46 -132 30 -200 q56 92 26 200 Z"/>
      <path d="M810 760 q-40 -98 20 -164 q52 66 32 164 Z"/>
    </g>
    <g fill="#FF3F52">
      <circle cx="626" cy="606" r="15"/><circle cx="656" cy="590" r="12"/>
      <circle cx="600" cy="590" r="11"/><circle cx="640" cy="628" r="10"/>
    </g>
    <g fill="#8FB86A">
      <path d="M1010 300 q120 40 156 150 q-130 -34 -156 -150 Z"/>
      <path d="M1030 430 q126 26 168 130 q-136 -18 -168 -130 Z"/>
    </g>
  </g>

  <!-- left figure -->
  <g>
    <path d="M196 900 L196 640 Q196 556 300 540 L392 540 Q492 556 492 640 L492 900 Z" fill="url(#kurta)"/>
    <path d="M300 540 L392 540 L376 596 L316 596 Z" fill="#EFB4F2" opacity="0.75"/>
    <rect x="316" y="486" width="60" height="70" rx="24" fill="#C98A6A"/>
    <circle cx="346" cy="424" r="82" fill="#C98A6A"/>
    <path d="M264 424 Q264 330 346 330 Q428 330 428 424 Q428 372 346 372 Q286 372 264 424 Z" fill="#241018"/>
    <path d="M264 410 Q252 560 236 660 L286 664 Q288 520 292 430 Z" fill="#241018"/>
    <circle cx="318" cy="424" r="8" fill="#241018"/><circle cx="374" cy="424" r="8" fill="#241018"/>
    <path d="M320 468 Q346 490 372 468" fill="none" stroke="#8C3A4A" stroke-width="9" stroke-linecap="round"/>
    <!-- arm reaching to the documents -->
    <path d="M470 660 Q560 690 626 726 L600 776 Q520 744 452 724 Z" fill="url(#kurta)"/>
    <ellipse cx="640" cy="746" rx="42" ry="28" fill="#C98A6A" transform="rotate(14 640 746)"/>
  </g>

  <!-- right figure -->
  <g>
    <path d="M1004 900 L1004 636 Q1004 552 900 536 L836 536 Q744 552 744 636 L744 900 Z" fill="url(#shirt)"/>
    <path d="M836 536 L900 536 L892 600 L846 600 Z" fill="#A96AE0" opacity="0.6"/>
    <rect x="846" y="482" width="58" height="66" rx="22" fill="#B87A58"/>
    <circle cx="878" cy="420" r="80" fill="#B87A58"/>
    <path d="M798 404 Q806 316 886 320 Q962 324 958 400 Q930 356 872 362 Q820 368 798 404 Z" fill="#1E0C14"/>
    <circle cx="846" cy="420" r="8" fill="#1E0C14"/>
    <path d="M820 462 Q846 480 872 462" fill="none" stroke="#7E3040" stroke-width="9" stroke-linecap="round"/>
    <!-- arm receiving -->
    <path d="M756 664 Q680 700 638 736 L668 782 Q722 748 780 730 Z" fill="url(#shirt)"/>
    <ellipse cx="646" cy="756" rx="40" ry="27" fill="#B87A58" transform="rotate(-12 646 756)"/>
    <rect x="744" y="880" width="260" height="20" fill="#2B0B21" opacity="0.5"/>
  </g>

  <!-- documents passing between them -->
  <g>
    <path d="M556 712 L790 686 L806 764 L572 792 Z" fill="#FBEEDF" stroke="#D8BCA4" stroke-width="4"/>
    <path d="M566 730 L780 706 L792 758 L578 782 Z" fill="#F8DBC9"/>
    <g stroke="#C2A088" stroke-width="5" stroke-linecap="round">
      <line x1="596" y1="740" x2="752" y2="722"/>
      <line x1="600" y1="758" x2="726" y2="744"/>
    </g>
  </g>

  <!-- counter -->
  <path d="M0 812 L470 812 L470 900 L0 900 Z" fill="url(#counter)"/>
  <path d="M0 812 L470 812 L470 832 L0 832 Z" fill="#FFB9A6"/>
  <rect x="60" y="782" width="300" height="30" rx="6" fill="#2B0B21"/>
</svg>
