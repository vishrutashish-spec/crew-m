<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!--
    Campaign creative: app install and re-engagement, city at dusk.
    Vector interpretation of the supplied reference (skyline, low sun, foliage)
    in the locked palette: cream #f8dbc9, plum red #FF3F52, plum violet #2B0B21.
  -->
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A7A"/>
      <stop offset="45%" stop-color="#FF6F72"/>
      <stop offset="100%" stop-color="#F8A9A0"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B4AA8"/>
      <stop offset="100%" stop-color="#3D1F5E"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B92D8"/>
      <stop offset="100%" stop-color="#6E62A8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky2)"/>
  <circle cx="470" cy="360" r="88" fill="#FFE68A"/>

  <!-- far towers -->
  <g fill="url(#far)">
    <rect x="120" y="150" width="150" height="560"/>
    <rect x="286" y="290" width="112" height="420"/>
    <rect x="560" y="440" width="120" height="270"/>
    <rect x="700" y="520" width="96" height="190"/>
  </g>

  <!-- mid towers -->
  <g fill="#8A7ECB">
    <rect x="640" y="330" width="150" height="380"/>
    <rect x="806" y="430" width="96" height="280"/>
  </g>

  <!-- near towers -->
  <g fill="url(#near)">
    <rect x="826" y="190" width="196" height="710"/>
    <rect x="1030" y="120" width="170" height="780"/>
    <rect x="380" y="600" width="240" height="300"/>
    <rect x="150" y="700" width="200" height="200"/>
  </g>

  <!-- lit windows -->
  <g fill="#FF3F52" opacity="0.9">
    <rect x="860" y="250" width="22" height="30"/><rect x="912" y="250" width="22" height="30"/>
    <rect x="964" y="250" width="22" height="30"/><rect x="860" y="330" width="22" height="30"/>
    <rect x="964" y="330" width="22" height="30"/><rect x="912" y="410" width="22" height="30"/>
    <rect x="860" y="490" width="22" height="30"/><rect x="964" y="490" width="22" height="30"/>
    <rect x="1064" y="190" width="24" height="32"/><rect x="1126" y="190" width="24" height="32"/>
    <rect x="1064" y="280" width="24" height="32"/><rect x="1126" y="366" width="24" height="32"/>
    <rect x="1064" y="452" width="24" height="32"/><rect x="1126" y="452" width="24" height="32"/>
    <rect x="1064" y="620" width="24" height="32"/><rect x="1126" y="706" width="24" height="32"/>
  </g>
  <g fill="#FFD98A" opacity="0.8">
    <rect x="676" y="380" width="18" height="24"/><rect x="726" y="440" width="18" height="24"/>
    <rect x="676" y="510" width="18" height="24"/><rect x="756" y="570" width="18" height="24"/>
    <rect x="176" y="220" width="20" height="26"/><rect x="226" y="300" width="20" height="26"/>
    <rect x="176" y="420" width="20" height="26"/><rect x="316" y="360" width="18" height="24"/>
    <rect x="356" y="470" width="18" height="24"/>
  </g>

  <!-- rooftop plant -->
  <g fill="#3D1F5E">
    <rect x="430" y="556" width="90" height="50"/>
    <rect x="900" y="150" width="34" height="44"/>
  </g>

  <!-- foliage foreground -->
  <g fill="#2E7A3A">
    <circle cx="90" cy="700" r="120"/><circle cx="210" cy="760" r="130"/>
    <circle cx="30" cy="820" r="120"/><circle cx="300" cy="840" r="110"/>
  </g>
  <g fill="#57A84A" opacity="0.85">
    <circle cx="120" cy="672" r="52"/><circle cx="232" cy="722" r="46"/>
    <circle cx="52" cy="782" r="44"/><circle cx="296" cy="800" r="40"/>
  </g>
</svg>
